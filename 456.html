<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Приглашение</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f6f2;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
}

/* карточка */
.card {
    background: #fffdf9;
    padding: 60px 50px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.07);
    text-align: center;
    max-width: 520px;
}

/* линии */
.card::before,
.card::after {
    content: "";
    position: absolute;
}

/* заголовок */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 44px;
    color: #8b7d6b;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
}

/* имя с золотым эффектом */
.name {
    font-size: 28px;
    margin-bottom: 10px;
    display: inline-block;
    background: linear-gradient(90deg, #bfa46f, #fff3c4, #bfa46f);
    background-size: 200%;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: 0.6s;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.5s;
}

.name:hover {
    background-position: 200%;
    text-shadow: 0 0 8px rgba(191,164,111,0.5);
}

/* строки */
.line {
    font-size: 20px;
    color: #7a6f63;
    margin: 6px 0;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
}

.line:nth-child(3) { animation-delay: 1s; }
.line:nth-child(4) { animation-delay: 1.5s; }
.line:nth-child(5) { animation-delay: 2s; }
.line:nth-child(6) { animation-delay: 2.5s; }

/* адрес */
.address {
    font-size: 18px;
    color: #9a8f82;
}

/* кнопки */
.btn {
    margin-top: 20px;
    padding: 12px 26px;
    border-radius: 30px;
    border: 1px solid #cbbfb0;
    background: transparent;
    cursor: pointer;
    transition: 0.3s;
    font-size: 15px;
}

.btn:hover {
    background: #f1ebe4;
    transform: translateY(-2px);
}

/* анимация */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* фоновые частицы */
.spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(200,180,150,0.3);
    border-radius: 50%;
    animation: float 8s infinite;
}

@keyframes float {
    0% {transform: translateY(0); opacity:0;}
    50% {opacity:1;}
    100% {transform: translateY(-100vh); opacity:0;}
}
</style>
</head>

<body>

<!-- музыка -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>Я вас приглашаю на своё день рождения</h1>

    <div class="name">Дария</div>

    <div class="line">10 мая · 18:00</div>

    <div class="line address">
        Ресторан «Altyn Qasyq»<br>
        Кунаева 14
    </div>

    <div class="line">Этот вечер будет наполнен теплом и красотой.</div>
    <div class="line">Буду очень рада видеть вас ✨</div>

    <button class="btn" onclick="alert('Буду ждать тебя ❤️')">
        Подтвердить присутствие
    </button>

    <br>

    <button class="btn" onclick="window.open('https://maps.google.com/?q=Altyn+Qasyq+Kunaeva+14','_blank')">
        Открыть на карте 📍
    </button>
</div>

<script>
for (let i = 0; i < 15; i++) {
    let s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (5 + Math.random()*5) + "s";
    document.body.appendChild(s);
}
</script>

</body>
</html>
